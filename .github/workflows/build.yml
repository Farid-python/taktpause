name: Build

# Runs when a version tag such as v0.18.0-beta is pushed, and by hand from the
# Actions tab ("Run workflow"). Forks can use the manual run to build their own
# Taktpause.exe and snap without installing anything.
# A manual run with a release tag also publishes a release with that tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, for example v0.18.1. Leave empty for a test build without a release."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  windows:
    name: Windows (Taktpause.exe)
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write      # sign the build attestation
      attestations: write  # store the build attestation
    steps:
      - name: Get the code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install packages
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Run the self-test
        run: python taktpause.py --self-test

      - name: Build Taktpause.exe
        run: python packaging/windows/build.py

      - name: Attest where the file was built
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/Taktpause.exe

      - name: Keep the file as a download of this run
        uses: actions/upload-artifact@v6
        with:
          name: Taktpause-windows
          path: dist/Taktpause.exe
          if-no-files-found: error

  linux:
    name: Ubuntu (snap)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Get the code
        uses: actions/checkout@v6

      - name: Build the snap
        id: snap
        uses: snapcore/action-build@v1

      - name: Attest where the file was built
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ steps.snap.outputs.snap }}

      - name: Keep the file as a download of this run
        uses: actions/upload-artifact@v6
        with:
          name: Taktpause-snap
          path: ${{ steps.snap.outputs.snap }}
          if-no-files-found: error

  release:
    name: Publish the release
    # Only for version tags or a manual run with a release tag. The Windows
    # build must succeed; the snap is added when its build succeeded too.
    if: >-
      always() && needs.windows.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '')
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Get the code
        uses: actions/checkout@v6

      - name: Collect the builds
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Write SHA-256 checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "The release tag must look like v0.18.1"; exit 1 ;;
          esac
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          notes="docs/release-notes/$TAG.md"
          if [ -f "$notes" ]; then
            notes_args=(--notes-file "$notes")
          else
            notes_args=(--generate-notes)
          fi
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "Taktpause ${TAG#v}" $prerelease "${notes_args[@]}"
